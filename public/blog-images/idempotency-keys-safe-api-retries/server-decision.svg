<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#facc15"/></marker>
  </defs>
  <rect width="960" height="560" rx="24" fill="#0f1117"/>
  <text x="48" y="64" fill="#e8eaf0" font-size="26" font-weight="700">What the server does with a key</text>
  <text x="48" y="96" fill="#9aa3b5" font-size="17">Status codes follow the IETF Idempotency-Key draft</text>

  <rect x="48" y="136" width="230" height="64" rx="14" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
  <text x="72" y="174" fill="#e8eaf0" font-size="17">Request arrives</text>

  <path d="M278 168 L 336 168" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <rect x="340" y="136" width="230" height="64" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="364" y="174" fill="#e8eaf0" font-size="17">Key header present?</text>
  <path d="M570 168 L 680 168" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <text x="604" y="156" fill="#9aa3b5" font-size="14">no</text>
  <rect x="684" y="136" width="228" height="64" rx="14" fill="#2a1414" stroke="#f87171" stroke-width="2"/>
  <text x="706" y="174" fill="#fca5a5" font-size="17">400 Bad Request</text>

  <path d="M455 200 L 455 252" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <text x="466" y="232" fill="#9aa3b5" font-size="14">yes</text>
  <rect x="340" y="256" width="230" height="64" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="364" y="294" fill="#e8eaf0" font-size="17">Key seen before?</text>
  <path d="M340 288 L 282 288" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <text x="300" y="276" fill="#9aa3b5" font-size="14">no</text>
  <rect x="48" y="256" width="230" height="64" rx="14" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="72" y="284" fill="#6ee7b7" font-size="16">Claim key, do work,</text>
  <text x="72" y="306" fill="#6ee7b7" font-size="16">save response</text>

  <path d="M455 320 L 455 372" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <text x="466" y="352" fill="#9aa3b5" font-size="14">yes</text>
  <rect x="340" y="376" width="230" height="64" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="364" y="414" fill="#e8eaf0" font-size="17">Same request body?</text>
  <path d="M570 408 L 680 408" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <text x="604" y="396" fill="#9aa3b5" font-size="14">no</text>
  <rect x="684" y="376" width="228" height="64" rx="14" fill="#2a1414" stroke="#f87171" stroke-width="2"/>
  <text x="706" y="414" fill="#fca5a5" font-size="17">422 key reused</text>

  <path d="M455 440 L 455 480" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <text x="466" y="468" fill="#9aa3b5" font-size="14">yes</text>
  <rect x="200" y="484" width="250" height="52" rx="14" fill="#2a2210" stroke="#facc15" stroke-width="2"/>
  <text x="222" y="516" fill="#fde68a" font-size="16">Still running: 409</text>
  <rect x="470" y="484" width="300" height="52" rx="14" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="492" y="516" fill="#6ee7b7" font-size="16">Finished: replay saved response</text>
</svg>
