<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" role="img" aria-label="DevPrep Academy Mark - Dark Mode">
  <defs>
    <!-- Cap top gradient -->
    <linearGradient id="dp-cap-dark" x1="160" y1="50" x2="350" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Cap bevel gradient -->
    <linearGradient id="dp-bevel-dark" x1="120" y1="120" x2="392" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- Book inner gold gradient -->
    <linearGradient id="dp-book-gold-dark" x1="130" y1="310" x2="382" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <!-- Tassel cord gold -->
    <linearGradient id="dp-cord-dark" x1="256" y1="105" x2="135" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
  </defs>

  <!-- 1. MORTARBOARD CAP -->
  <!-- Cap lower bevel edge -->
  <path d="M 120 120 L 256 168 L 392 120 L 392 134 L 256 182 L 120 134 Z" fill="url(#dp-bevel-dark)"/>

  <!-- Cap main diamond surface -->
  <polygon points="256,52 392,120 256,168 120,120" fill="url(#dp-cap-dark)"/>

  <!-- Center cap button -->
  <ellipse cx="256" cy="118" rx="8" ry="4.5" fill="#FFF9C4"/>

  <!-- Tassel Cord -->
  <path d="M 256 118 Q 185 110 132 132" fill="none" stroke="url(#dp-cord-dark)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Tassel hanging drop -->
  <circle cx="132" cy="136" r="3.5" fill="#FFD54F"/>
  <rect x="129" y="140" width="6" height="4" rx="1.5" fill="#FFA000"/>
  <!-- Tassel skirt (golden/warm white on dark) -->
  <path d="M 129 144 L 126 195 C 126 198 138 198 138 195 L 135 144 Z" fill="#FFE082"/>

  <!-- 2. CODE BRACKETS: </> in center (White) -->
  <g stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Chevron < -->
    <path d="M 200 220 L 164 246 L 200 272"/>
    <!-- Middle Slash / -->
    <path d="M 268 214 L 244 278"/>
    <!-- Right Chevron > -->
    <path d="M 312 220 L 348 246 L 312 272"/>
  </g>

  <!-- 3. OPEN BOOK BASE -->
  <!-- Outer Book Base (Subtle lighter foundation) -->
  <path d="M 256 424 
           C 214 402 164 394 118 408 
           L 118 368 
           C 166 352 216 360 256 380 
           C 296 360 346 352 394 368 
           L 394 408 
           C 348 394 298 402 256 424 Z" 
        fill="#FFB300" opacity="0.25"/>

  <!-- Inner Book Pages (Luminous golden spread) -->
  <!-- Left page -->
  <path d="M 256 374 
           C 218 344 166 336 122 350 
           C 120 330 120 310 124 294 
           C 168 280 220 292 256 324 Z" 
        fill="url(#dp-book-gold-dark)"/>

  <!-- Right page -->
  <path d="M 256 374 
           C 294 344 346 336 390 350 
           C 392 330 392 310 388 294 
           C 344 280 292 292 256 324 Z" 
        fill="url(#dp-book-gold-dark)"/>

  <!-- Spine highlight -->
  <path d="M 256 324 L 256 374" stroke="#FFF9C4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
