<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="480" fill="#0f1117"/>
  <text x="40" y="52" fill="#e8eaf0" font-size="22" font-weight="700">A new post arrives between page 1 and page 2</text>

  <text x="40" y="112" fill="#9aa3b5" font-size="15" font-weight="700">page 1 (before)</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="240" y="88" width="64" height="40" rx="8" fill="#14243d" stroke="#60a5fa" stroke-width="2"/><text x="272" y="114" fill="#bfdbfe">10</text>
    <rect x="316" y="88" width="64" height="40" rx="8" fill="#14243d" stroke="#60a5fa" stroke-width="2"/><text x="348" y="114" fill="#bfdbfe">9</text>
    <rect x="392" y="88" width="64" height="40" rx="8" fill="#14243d" stroke="#60a5fa" stroke-width="2"/><text x="424" y="114" fill="#bfdbfe">8</text>
  </g>

  <text x="40" y="192" fill="#9aa3b5" font-size="15" font-weight="700">feed now</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="164" y="168" width="64" height="40" rx="8" fill="#3a3112" stroke="#facc15" stroke-width="2"/><text x="196" y="194" fill="#fde68a">11</text>
    <rect x="240" y="168" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="272" y="194" fill="#e8eaf0">10</text>
    <rect x="316" y="168" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="348" y="194" fill="#e8eaf0">9</text>
    <rect x="392" y="168" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="424" y="194" fill="#e8eaf0">8</text>
    <rect x="468" y="168" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="500" y="194" fill="#e8eaf0">7</text>
    <rect x="544" y="168" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="576" y="194" fill="#e8eaf0">6</text>
    <rect x="620" y="168" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="652" y="194" fill="#e8eaf0">5</text>
  </g>

  <rect x="40" y="260" width="420" height="180" rx="14" fill="#171a23" stroke="#f87171" stroke-width="2"/>
  <text x="250" y="296" fill="#fecaca" font-size="16" font-weight="700" text-anchor="middle">offset: skip 3, take 3</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="146" y="320" width="64" height="40" rx="8" fill="#3a1717" stroke="#f87171" stroke-width="2"/><text x="178" y="346" fill="#fecaca">8</text>
    <rect x="222" y="320" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="254" y="346" fill="#e8eaf0">7</text>
    <rect x="298" y="320" width="64" height="40" rx="8" fill="#171a23" stroke="#4b5266" stroke-width="2"/><text x="330" y="346" fill="#e8eaf0">6</text>
  </g>
  <text x="250" y="400" fill="#fca5a5" font-size="15" text-anchor="middle">post 8 shown twice</text>

  <rect x="500" y="260" width="420" height="180" rx="14" fill="#171a23" stroke="#34d399" stroke-width="2"/>
  <text x="710" y="296" fill="#6ee7b7" font-size="16" font-weight="700" text-anchor="middle">keyset: older than 8, take 3</text>
  <g font-size="18" font-weight="700" text-anchor="middle">
    <rect x="606" y="320" width="64" height="40" rx="8" fill="#10251d" stroke="#34d399" stroke-width="2"/><text x="638" y="346" fill="#6ee7b7">7</text>
    <rect x="682" y="320" width="64" height="40" rx="8" fill="#10251d" stroke="#34d399" stroke-width="2"/><text x="714" y="346" fill="#6ee7b7">6</text>
    <rect x="758" y="320" width="64" height="40" rx="8" fill="#10251d" stroke="#34d399" stroke-width="2"/><text x="790" y="346" fill="#6ee7b7">5</text>
  </g>
  <text x="710" y="400" fill="#6ee7b7" font-size="15" text-anchor="middle">continues where page 1 ended</text>
</svg>
