<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b5"/>
    </marker>
  </defs>
  <rect width="960" height="500" fill="#0f1117"/>
  <rect x="30" y="30" width="430" height="440" rx="16" fill="#171a23"/>
  <rect x="500" y="30" width="430" height="440" rx="16" fill="#171a23"/>
  <text x="245" y="72" fill="#93c5fd" font-size="20" font-weight="700" text-anchor="middle">interface</text>
  <text x="715" y="72" fill="#c4b5fd" font-size="20" font-weight="700" text-anchor="middle">type alias</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="60" y="100" width="170" height="50" rx="10" fill="#14243d" stroke="#60a5fa" stroke-width="2"/>
    <text x="145" y="131" fill="#bfdbfe">User { id }</text>
    <rect x="260" y="100" width="170" height="50" rx="10" fill="#14243d" stroke="#60a5fa" stroke-width="2"/>
    <text x="345" y="131" fill="#bfdbfe">User { name }</text>
    <rect x="120" y="200" width="250" height="50" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
    <text x="245" y="231" fill="#6ee7b7">User { id, name }</text>

    <rect x="530" y="100" width="170" height="50" rx="10" fill="#1f1a33" stroke="#a78bfa" stroke-width="2"/>
    <text x="615" y="131" fill="#ddd6fe">Account { id }</text>
    <rect x="730" y="100" width="170" height="50" rx="10" fill="#1f1a33" stroke="#a78bfa" stroke-width="2"/>
    <text x="815" y="131" fill="#ddd6fe">Account { name }</text>
    <rect x="590" y="200" width="250" height="50" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <text x="715" y="231" fill="#fecaca">Duplicate identifier</text>
  </g>
  <line x1="145" y1="150" x2="200" y2="196" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="345" y1="150" x2="290" y2="196" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="615" y1="150" x2="670" y2="196" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="815" y1="150" x2="760" y2="196" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <text x="245" y="282" fill="#9aa3b5" font-size="14" text-anchor="middle">declarations merge</text>
  <text x="715" y="282" fill="#9aa3b5" font-size="14" text-anchor="middle">cannot be redeclared</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="60" y="320" width="370" height="50" rx="10" fill="#14243d" stroke="#60a5fa" stroke-width="2"/>
    <text x="245" y="351" fill="#bfdbfe">Child extends Base, id: number</text>
    <rect x="530" y="320" width="370" height="50" rx="10" fill="#1f1a33" stroke="#a78bfa" stroke-width="2"/>
    <text x="715" y="351" fill="#ddd6fe">BaseT &amp; { id: number }</text>
  </g>
  <rect x="60" y="400" width="370" height="50" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
  <text x="245" y="431" fill="#fecaca" font-size="15" text-anchor="middle">error at the declaration</text>
  <rect x="530" y="400" width="370" height="50" rx="10" fill="#3a3112" stroke="#facc15" stroke-width="2"/>
  <text x="715" y="431" fill="#fde68a" font-size="15" text-anchor="middle">accepted, id becomes never</text>
</svg>
