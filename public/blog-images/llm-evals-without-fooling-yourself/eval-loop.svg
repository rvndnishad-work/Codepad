<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b5"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#0f1117"/>

  <rect x="30" y="80" width="190" height="120" rx="14" fill="#14243d" stroke="#60a5fa" stroke-width="2"/>
  <text x="125" y="122" fill="#bfdbfe" font-size="18" font-weight="700" text-anchor="middle">Dataset</text>
  <text x="125" y="150" fill="#9aa3b5" font-size="14" text-anchor="middle">tagged examples</text>
  <text x="125" y="172" fill="#9aa3b5" font-size="14" text-anchor="middle">plus held-out slice</text>

  <rect x="270" y="80" width="190" height="120" rx="14" fill="#171a23" stroke="#a78bfa" stroke-width="2"/>
  <text x="365" y="122" fill="#ddd6fe" font-size="18" font-weight="700" text-anchor="middle">System</text>
  <text x="365" y="150" fill="#9aa3b5" font-size="14" text-anchor="middle">prompt, model,</text>
  <text x="365" y="172" fill="#9aa3b5" font-size="14" text-anchor="middle">tools, retrieval</text>

  <rect x="510" y="80" width="190" height="120" rx="14" fill="#3a3112" stroke="#facc15" stroke-width="2"/>
  <text x="605" y="122" fill="#fde68a" font-size="18" font-weight="700" text-anchor="middle">Graders</text>
  <text x="605" y="150" fill="#9aa3b5" font-size="14" text-anchor="middle">code first, judge</text>
  <text x="605" y="172" fill="#9aa3b5" font-size="14" text-anchor="middle">with swapped order</text>

  <rect x="750" y="80" width="180" height="120" rx="14" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="840" y="122" fill="#6ee7b7" font-size="18" font-weight="700" text-anchor="middle">Report</text>
  <text x="840" y="150" fill="#9aa3b5" font-size="14" text-anchor="middle">score with range,</text>
  <text x="840" y="172" fill="#9aa3b5" font-size="14" text-anchor="middle">per tag, changes</text>

  <line x1="220" y1="140" x2="264" y2="140" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="140" x2="504" y2="140" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="140" x2="744" y2="140" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>

  <line x1="840" y1="200" x2="840" y2="294" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <rect x="690" y="300" width="240" height="100" rx="14" fill="#171a23" stroke="#e8eaf0" stroke-width="2"/>
  <text x="810" y="340" fill="#e8eaf0" font-size="17" font-weight="700" text-anchor="middle">Compare with v1</text>
  <text x="810" y="368" fill="#9aa3b5" font-size="14" text-anchor="middle">sign test on disagreements</text>

  <rect x="290" y="300" width="300" height="100" rx="14" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
  <text x="440" y="340" fill="#fecaca" font-size="17" font-weight="700" text-anchor="middle">Production failure</text>
  <text x="440" y="368" fill="#9aa3b5" font-size="14" text-anchor="middle">fixed, then added as example</text>
  <path d="M290 350 L125 350 L125 206" fill="none" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
</svg>
