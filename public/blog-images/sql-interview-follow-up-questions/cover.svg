<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="50%">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="800" fill="#0b0d12"/>
  <rect width="1600" height="800" fill="url(#glow)"/>
  <rect width="1600" height="800" fill="url(#glow2)"/>

  <text x="72" y="300" fill="#a78bfa" font-size="24" font-weight="700" letter-spacing="5">INTERVIEW CRAFT</text>
  <text x="72" y="372" fill="#f4f5f8" font-size="56" font-weight="800">SQL.</text>
  <text x="72" y="436" fill="#f4f5f8" font-size="56" font-weight="800">Then the</text>
  <text x="72" y="500" fill="#f4f5f8" font-size="56" font-weight="800">follow-ups.</text>

  <!-- centre: a query card and the follow-up question bubbles -->
  <rect x="470" y="250" width="420" height="300" rx="24" fill="#171a23" stroke="#2a2f3d" stroke-width="2"/>
  <circle cx="506" cy="284" r="8" fill="#f87171"/>
  <circle cx="534" cy="284" r="8" fill="#facc15"/>
  <circle cx="562" cy="284" r="8" fill="#34d399"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26">
    <text x="506" y="350" fill="#a78bfa">SELECT</text>
    <text x="630" y="350" fill="#e8eaf0">name</text>
    <text x="506" y="396" fill="#a78bfa">FROM</text>
    <text x="600" y="396" fill="#e8eaf0">employees</text>
    <text x="506" y="442" fill="#a78bfa">WHERE</text>
    <text x="616" y="442" fill="#e8eaf0">id</text>
    <text x="664" y="442" fill="#f87171">NOT IN</text>
    <text x="506" y="488" fill="#e8eaf0">(...)</text>
  </g>

  <rect x="940" y="250" width="220" height="80" rx="40" fill="#2a1f45" stroke="#a78bfa" stroke-width="3"/>
  <text x="1050" y="302" fill="#ddd6fe" font-size="34" font-weight="800" text-anchor="middle">and NULL?</text>
  <rect x="940" y="360" width="220" height="80" rx="40" fill="#3a3112" stroke="#facc15" stroke-width="3"/>
  <text x="1050" y="412" fill="#fde68a" font-size="34" font-weight="800" text-anchor="middle">why slow?</text>
  <rect x="940" y="470" width="220" height="80" rx="40" fill="#10251d" stroke="#34d399" stroke-width="3"/>
  <text x="1050" y="522" fill="#6ee7b7" font-size="34" font-weight="800" text-anchor="middle">ties?</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <rect x="1250" y="276" width="280" height="56" rx="28" fill="#171a23" stroke="#f87171" stroke-width="2"/>
    <text x="1390" y="312" fill="#e8eaf0" text-anchor="middle">NOT EXISTS</text>
    <rect x="1250" y="372" width="280" height="56" rx="28" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
    <text x="1390" y="408" fill="#e8eaf0" text-anchor="middle">EXPLAIN</text>
    <rect x="1250" y="468" width="280" height="56" rx="28" fill="#171a23" stroke="#34d399" stroke-width="2"/>
    <text x="1390" y="504" fill="#e8eaf0" text-anchor="middle">DENSE_RANK</text>
  </g>
</svg>
