<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b5"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#0f1117"/>

  <rect x="330" y="30" width="300" height="70" rx="12" fill="#171a23" stroke="#facc15" stroke-width="2"/>
  <text x="480" y="60" fill="#fde68a" font-size="17" font-weight="700" text-anchor="middle">Rule: at least one on call</text>
  <text x="480" y="84" fill="#9aa3b5" font-size="14" text-anchor="middle">alice and bob both on call</text>

  <rect x="40" y="140" width="380" height="120" rx="14" fill="#14243d" stroke="#60a5fa" stroke-width="2"/>
  <text x="230" y="176" fill="#bfdbfe" font-size="17" font-weight="700" text-anchor="middle">A: count on call = 2</text>
  <text x="230" y="210" fill="#e8eaf0" font-size="15" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">alice off call</text>
  <text x="230" y="238" fill="#9aa3b5" font-size="13" text-anchor="middle">writes the alice row</text>

  <rect x="540" y="140" width="380" height="120" rx="14" fill="#1f1a33" stroke="#a78bfa" stroke-width="2"/>
  <text x="730" y="176" fill="#ddd6fe" font-size="17" font-weight="700" text-anchor="middle">B: count on call = 2</text>
  <text x="730" y="210" fill="#e8eaf0" font-size="15" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">bob off call</text>
  <text x="730" y="238" fill="#9aa3b5" font-size="13" text-anchor="middle">writes the bob row</text>

  <line x1="230" y1="260" x2="230" y2="314" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="730" y1="260" x2="730" y2="314" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="287" x2="730" y2="287" stroke="#9aa3b5" stroke-width="2"/>

  <rect x="40" y="320" width="380" height="130" rx="14" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
  <text x="230" y="358" fill="#fecaca" font-size="18" font-weight="700" text-anchor="middle">Repeatable Read</text>
  <text x="230" y="390" fill="#e8eaf0" font-size="15" text-anchor="middle">both commit, different rows</text>
  <text x="230" y="420" fill="#fca5a5" font-size="15" font-weight="700" text-anchor="middle">0 on call</text>

  <rect x="540" y="320" width="380" height="130" rx="14" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="730" y="358" fill="#6ee7b7" font-size="18" font-weight="700" text-anchor="middle">Serializable</text>
  <text x="730" y="390" fill="#e8eaf0" font-size="15" text-anchor="middle">B commit fails with 40001</text>
  <text x="730" y="420" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">1 on call, retry B</text>
</svg>
