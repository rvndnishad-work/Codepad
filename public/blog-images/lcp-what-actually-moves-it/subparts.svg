<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="440" fill="#0f1117"/>
  <line x1="60" y1="90" x2="60" y2="230" stroke="#9aa3b5" stroke-width="2"/>
  <line x1="900" y1="90" x2="900" y2="230" stroke="#facc15" stroke-width="2"/>
  <text x="60" y="76" fill="#9aa3b5" font-size="15" text-anchor="start">page load starts</text>
  <text x="900" y="76" fill="#facc15" font-size="15" font-weight="700" text-anchor="end">hero painted: LCP</text>

  <rect x="60" y="120" width="210" height="80" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <rect x="270" y="120" width="210" height="80" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
  <rect x="480" y="120" width="210" height="80" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <rect x="690" y="120" width="210" height="80" fill="#2a1f45" stroke="#a78bfa" stroke-width="2"/>
  <text x="165" y="156" fill="#bfdbfe" font-size="17" font-weight="700" text-anchor="middle">TTFB</text>
  <text x="165" y="180" fill="#9aa3b5" font-size="13" text-anchor="middle">HTML first byte</text>
  <text x="375" y="156" fill="#fecaca" font-size="17" font-weight="700" text-anchor="middle">load delay</text>
  <text x="375" y="180" fill="#9aa3b5" font-size="13" text-anchor="middle">until download starts</text>
  <text x="585" y="156" fill="#a7f3d0" font-size="17" font-weight="700" text-anchor="middle">load duration</text>
  <text x="585" y="180" fill="#9aa3b5" font-size="13" text-anchor="middle">the download itself</text>
  <text x="795" y="156" fill="#ddd6fe" font-size="17" font-weight="700" text-anchor="middle">render delay</text>
  <text x="795" y="180" fill="#9aa3b5" font-size="13" text-anchor="middle">loaded until painted</text>

  <line x1="165" y1="200" x2="165" y2="290" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="375" y1="200" x2="375" y2="290" stroke="#f87171" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="585" y1="200" x2="585" y2="290" stroke="#34d399" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="795" y1="200" x2="795" y2="290" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="70" y="290" width="190" height="96" rx="10" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
  <text x="165" y="324" fill="#e8eaf0" font-size="15" text-anchor="middle">edge HTML cache</text>
  <text x="165" y="350" fill="#e8eaf0" font-size="15" text-anchor="middle">fewer redirects</text>
  <rect x="280" y="290" width="190" height="96" rx="10" fill="#171a23" stroke="#f87171" stroke-width="2"/>
  <text x="375" y="324" fill="#e8eaf0" font-size="15" text-anchor="middle">img in the HTML</text>
  <text x="375" y="350" fill="#e8eaf0" font-size="15" text-anchor="middle">no lazy, preload</text>
  <rect x="490" y="290" width="190" height="96" rx="10" fill="#171a23" stroke="#34d399" stroke-width="2"/>
  <text x="585" y="324" fill="#e8eaf0" font-size="15" text-anchor="middle">smaller file</text>
  <text x="585" y="350" fill="#e8eaf0" font-size="15" text-anchor="middle">fetchpriority high</text>
  <rect x="700" y="290" width="190" height="96" rx="10" fill="#171a23" stroke="#a78bfa" stroke-width="2"/>
  <text x="795" y="324" fill="#e8eaf0" font-size="15" text-anchor="middle">server-render img</text>
  <text x="795" y="350" fill="#e8eaf0" font-size="15" text-anchor="middle">less blocking JS</text>
</svg>
