<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="500" fill="#0f1117"/>
  <text x="40" y="52" fill="#e8eaf0" font-size="22" font-weight="700">The cache key is the whole prefix, in order</text>

  <!-- row 1: stable first -->
  <text x="40" y="112" fill="#6ee7b7" font-size="16" font-weight="700">stable first</text>
  <rect x="40" y="128" width="200" height="60" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="140" y="164" fill="#e8eaf0" font-size="16" text-anchor="middle">tools</text>
  <rect x="250" y="128" width="260" height="60" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="380" y="164" fill="#e8eaf0" font-size="16" text-anchor="middle">system prompt</text>
  <rect x="520" y="128" width="170" height="60" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="605" y="164" fill="#e8eaf0" font-size="16" text-anchor="middle">documents</text>
  <rect x="740" y="128" width="180" height="60" rx="10" fill="#3a3112" stroke="#facc15" stroke-width="2"/>
  <text x="830" y="156" fill="#fde68a" font-size="15" text-anchor="middle">time + question</text>
  <text x="830" y="176" fill="#9aa3b5" font-size="13" text-anchor="middle">changes every call</text>
  <line x1="715" y1="116" x2="715" y2="200" stroke="#facc15" stroke-width="3"/>
  <text x="715" y="222" fill="#fde68a" font-size="13" text-anchor="middle">breakpoint</text>
  <rect x="40" y="236" width="650" height="34" rx="8" fill="#10251d"/>
  <text x="365" y="259" fill="#6ee7b7" font-size="15" font-weight="700" text-anchor="middle">read from cache on every later call</text>

  <!-- row 2: timestamp in system prompt -->
  <text x="40" y="324" fill="#fecaca" font-size="16" font-weight="700">timestamp inside the system prompt</text>
  <rect x="40" y="340" width="200" height="60" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="140" y="376" fill="#e8eaf0" font-size="16" text-anchor="middle">tools</text>
  <rect x="250" y="340" width="260" height="60" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
  <text x="380" y="368" fill="#fecaca" font-size="16" text-anchor="middle">system prompt</text>
  <text x="380" y="388" fill="#fca5a5" font-size="13" text-anchor="middle">Current time: 10:02</text>
  <rect x="520" y="340" width="170" height="60" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
  <text x="605" y="376" fill="#fecaca" font-size="16" text-anchor="middle">documents</text>
  <rect x="740" y="340" width="180" height="60" rx="10" fill="#3a3112" stroke="#facc15" stroke-width="2"/>
  <text x="830" y="376" fill="#fde68a" font-size="15" text-anchor="middle">question</text>
  <line x1="715" y1="328" x2="715" y2="412" stroke="#facc15" stroke-width="3"/>
  <rect x="250" y="436" width="440" height="34" rx="8" fill="#3a1717"/>
  <text x="470" y="459" fill="#fecaca" font-size="15" font-weight="700" text-anchor="middle">new key every call, written again, never read</text>
</svg>
