<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="1600" height="800" fill="#0b0d12"/>
  <rect width="1600" height="800" fill="url(#glow)"/>
  <rect width="1600" height="800" fill="url(#glow2)"/>

  <text x="72" y="300" fill="#a78bfa" font-size="24" font-weight="700" letter-spacing="5">INTERVIEW</text>
  <text x="72" y="372" fill="#f4f5f8" font-size="56" font-weight="800">Node.js</text>
  <text x="72" y="436" fill="#f4f5f8" font-size="56" font-weight="800">follow-ups,</text>
  <text x="72" y="500" fill="#f4f5f8" font-size="56" font-weight="800">all run</text>

  <!-- centre: the event loop as a ring of phases -->
  <circle cx="800" cy="400" r="200" fill="none" stroke="#2a3040" stroke-width="40"/>
  <path d="M 800 200 A 200 200 0 0 1 973 500" fill="none" stroke="#34d399" stroke-width="10" marker-end="url(#g)"/>
  <g font-size="22" font-weight="800" text-anchor="middle">
    <rect x="700" y="170" width="200" height="60" rx="14" fill="#171a23" stroke="#60a5fa" stroke-width="3"/>
    <text x="800" y="208" fill="#bfdbfe">timers</text>
    <rect x="900" y="470" width="200" height="60" rx="14" fill="#171a23" stroke="#34d399" stroke-width="3"/>
    <text x="1000" y="508" fill="#a7f3d0">poll</text>
    <rect x="500" y="470" width="200" height="60" rx="14" fill="#171a23" stroke="#facc15" stroke-width="3"/>
    <text x="600" y="508" fill="#fde68a">check</text>
  </g>
  <text x="800" y="392" fill="#e8eaf0" font-size="30" font-weight="800" text-anchor="middle">one thread</text>
  <text x="800" y="428" fill="#9aa3b5" font-size="20" text-anchor="middle">event loop</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <rect x="1250" y="276" width="280" height="56" rx="28" fill="#171a23" stroke="#a78bfa" stroke-width="2"/>
    <text x="1390" y="312" fill="#e8eaf0" text-anchor="middle">nextTick</text>
    <rect x="1250" y="372" width="280" height="56" rx="28" fill="#171a23" stroke="#facc15" stroke-width="2"/>
    <text x="1390" y="408" fill="#e8eaf0" text-anchor="middle">setImmediate</text>
    <rect x="1250" y="468" width="280" height="56" rx="28" fill="#171a23" stroke="#34d399" stroke-width="2"/>
    <text x="1390" y="504" fill="#e8eaf0" text-anchor="middle">pipeline()</text>
  </g>
</svg>
