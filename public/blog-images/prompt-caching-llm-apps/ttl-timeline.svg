<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="460" fill="#0f1117"/>
  <text x="40" y="52" fill="#e8eaf0" font-size="22" font-weight="700">Requests sharing a prefix over 30 minutes</text>

  <!-- axis: x = 140 + minute * 26 -->
  <line x1="140" y1="390" x2="920" y2="390" stroke="#4b5266" stroke-width="2"/>
  <text x="140" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">0</text>
  <text x="270" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">5</text>
  <text x="400" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">10</text>
  <text x="530" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">15</text>
  <text x="660" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">20</text>
  <text x="790" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">25</text>
  <text x="920" y="420" fill="#9aa3b5" font-size="14" text-anchor="middle">30 min</text>

  <!-- 5-minute TTL row: requests at 0, 2, 4, then 16, 18 -->
  <text x="40" y="146" fill="#e8eaf0" font-size="16" font-weight="700">5 min TTL</text>
  <rect x="140" y="126" width="234" height="30" rx="6" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="257" y="146" fill="#6ee7b7" font-size="14" text-anchor="middle">warm, reads reset it</text>
  <rect x="374" y="126" width="182" height="30" rx="6" fill="#1a1d26" stroke="#4b5266" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="465" y="146" fill="#9aa3b5" font-size="14" text-anchor="middle">expired</text>
  <rect x="556" y="126" width="182" height="30" rx="6" fill="#10251d" stroke="#34d399" stroke-width="2"/>
  <text x="647" y="146" fill="#6ee7b7" font-size="14" text-anchor="middle">warm again</text>
  <circle cx="140" cy="190" r="12" fill="#facc15"/>
  <circle cx="192" cy="190" r="12" fill="#34d399"/>
  <circle cx="244" cy="190" r="12" fill="#34d399"/>
  <circle cx="556" cy="190" r="12" fill="#facc15"/>
  <circle cx="608" cy="190" r="12" fill="#34d399"/>

  <!-- 1-hour TTL row -->
  <text x="40" y="276" fill="#e8eaf0" font-size="16" font-weight="700">1 hour TTL</text>
  <rect x="140" y="256" width="780" height="30" rx="6" fill="#14243d" stroke="#60a5fa" stroke-width="2"/>
  <text x="530" y="276" fill="#bfdbfe" font-size="14" text-anchor="middle">warm the whole time, but the first write cost 2x</text>
  <circle cx="140" cy="320" r="12" fill="#facc15"/>
  <circle cx="192" cy="320" r="12" fill="#34d399"/>
  <circle cx="244" cy="320" r="12" fill="#34d399"/>
  <circle cx="556" cy="320" r="12" fill="#34d399"/>
  <circle cx="608" cy="320" r="12" fill="#34d399"/>

  <!-- legend -->
  <circle cx="700" cy="84" r="9" fill="#facc15"/>
  <text x="716" y="89" fill="#e8eaf0" font-size="14">cache write</text>
  <circle cx="820" cy="84" r="9" fill="#34d399"/>
  <text x="836" y="89" fill="#e8eaf0" font-size="14">cache read</text>
</svg>
