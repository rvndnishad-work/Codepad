<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="50%">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="1600" height="800" fill="#0b0d12"/>
  <rect width="1600" height="800" fill="url(#glow)"/>
  <rect width="1600" height="800" fill="url(#glow2)"/>

  <text x="72" y="300" fill="#60a5fa" font-size="24" font-weight="700" letter-spacing="5">BACKEND</text>
  <text x="72" y="372" fill="#f4f5f8" font-size="56" font-weight="800">Stop</text>
  <text x="72" y="436" fill="#f4f5f8" font-size="56" font-weight="800">skipping</text>
  <text x="72" y="500" fill="#f4f5f8" font-size="56" font-weight="800">rows.</text>

  <!-- centre: a column of rows; offset walks them all, the cursor jumps -->
  <g>
    <rect x="560" y="170" width="300" height="44" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <rect x="560" y="226" width="300" height="44" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <rect x="560" y="282" width="300" height="44" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <rect x="560" y="338" width="300" height="44" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <rect x="560" y="394" width="300" height="44" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <rect x="560" y="450" width="300" height="44" rx="10" fill="#3a1717" stroke="#f87171" stroke-width="2"/>
    <rect x="560" y="530" width="300" height="44" rx="10" fill="#10251d" stroke="#34d399" stroke-width="3"/>
    <rect x="560" y="586" width="300" height="44" rx="10" fill="#10251d" stroke="#34d399" stroke-width="3"/>
  </g>
  <text x="710" y="420" fill="#fecaca" font-size="26" font-weight="800" text-anchor="middle">OFFSET 500000</text>
  <text x="710" y="561" fill="#6ee7b7" font-size="24" font-weight="800" text-anchor="middle">page</text>
  <path d="M940 190 C 1060 260, 1060 480, 890 552" fill="none" stroke="#34d399" stroke-width="6" marker-end="url(#g)"/>
  <text x="1040" y="380" fill="#6ee7b7" font-size="26" font-weight="800">seek</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <rect x="1250" y="276" width="280" height="56" rx="28" fill="#171a23" stroke="#f87171" stroke-width="2"/>
    <text x="1390" y="312" fill="#e8eaf0" text-anchor="middle">OFFSET n</text>
    <rect x="1250" y="372" width="280" height="56" rx="28" fill="#171a23" stroke="#34d399" stroke-width="2"/>
    <text x="1390" y="408" fill="#e8eaf0" text-anchor="middle">WHERE (t, id) &lt;</text>
    <rect x="1250" y="468" width="280" height="56" rx="28" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
    <text x="1390" y="504" fill="#e8eaf0" text-anchor="middle">next_cursor</text>
  </g>
</svg>
