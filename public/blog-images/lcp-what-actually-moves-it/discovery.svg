<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="480" fill="#0f1117"/>
  <text x="40" y="108" fill="#e8eaf0" font-size="16" font-weight="700">img in HTML</text>
  <text x="40" y="130" fill="#9aa3b5" font-size="13">preload scanner</text>
  <text x="40" y="228" fill="#e8eaf0" font-size="16" font-weight="700">CSS background</text>
  <text x="40" y="250" fill="#9aa3b5" font-size="13">after CSS and styles</text>
  <text x="40" y="348" fill="#e8eaf0" font-size="16" font-weight="700">img added by JS</text>
  <text x="40" y="370" fill="#9aa3b5" font-size="13">after app.js runs</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="220" y="96" width="90" height="40" rx="6" fill="#171a23" stroke="#9aa3b5" stroke-width="2"/>
    <text x="265" y="121" fill="#e8eaf0">HTML</text>
    <rect x="330" y="96" width="150" height="40" rx="6" fill="#3d3510" stroke="#facc15" stroke-width="2"/>
    <text x="405" y="121" fill="#fde68a">hero</text>

    <rect x="220" y="216" width="90" height="40" rx="6" fill="#171a23" stroke="#9aa3b5" stroke-width="2"/>
    <text x="265" y="241" fill="#e8eaf0">HTML</text>
    <rect x="330" y="216" width="110" height="40" rx="6" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="385" y="241" fill="#bfdbfe">CSS</text>
    <rect x="490" y="216" width="150" height="40" rx="6" fill="#3d3510" stroke="#facc15" stroke-width="2"/>
    <text x="565" y="241" fill="#fde68a">hero</text>

    <rect x="220" y="336" width="90" height="40" rx="6" fill="#171a23" stroke="#9aa3b5" stroke-width="2"/>
    <text x="265" y="361" fill="#e8eaf0">HTML</text>
    <rect x="330" y="336" width="380" height="40" rx="6" fill="#2a1f45" stroke="#a78bfa" stroke-width="2"/>
    <text x="520" y="361" fill="#ddd6fe">app.js downloads, then runs</text>
    <rect x="760" y="336" width="150" height="40" rx="6" fill="#3d3510" stroke="#facc15" stroke-width="2"/>
    <text x="835" y="361" fill="#fde68a">hero</text>
  </g>

  <line x1="220" y1="430" x2="920" y2="430" stroke="#4b5263" stroke-width="2"/>
  <text x="920" y="458" fill="#9aa3b5" font-size="14" text-anchor="end">time</text>
  <text x="220" y="458" fill="#9aa3b5" font-size="14" text-anchor="start">first byte of HTML</text>
</svg>
