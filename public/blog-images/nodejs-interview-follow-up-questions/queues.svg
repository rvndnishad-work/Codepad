<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b5"/></marker></defs>
  <rect width="960" height="500" fill="#0f1117"/>
  <g text-anchor="middle">
    <rect x="40" y="60" width="240" height="80" rx="10" fill="#171a23" stroke="#9aa3b5" stroke-width="2"/>
    <text x="160" y="96" fill="#e8eaf0" font-size="17" font-weight="700">synchronous code</text>
    <text x="160" y="120" fill="#9aa3b5" font-size="13">the current callback</text>
    <rect x="360" y="60" width="240" height="80" rx="10" fill="#2a1f45" stroke="#a78bfa" stroke-width="2"/>
    <text x="480" y="96" fill="#ddd6fe" font-size="17" font-weight="700">nextTick queue</text>
    <text x="480" y="120" fill="#9aa3b5" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">process.nextTick</text>
    <rect x="680" y="60" width="240" height="80" rx="10" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="800" y="96" fill="#bfdbfe" font-size="17" font-weight="700">microtask queue</text>
    <text x="800" y="120" fill="#9aa3b5" font-size="13">promises, queueMicrotask</text>
  </g>
  <line x1="280" y1="100" x2="352" y2="100" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="100" x2="672" y2="100" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <path d="M800 140 L800 210 L200 210 L200 292" fill="none" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="270" fill="#9aa3b5" font-size="14" font-weight="700" letter-spacing="2">EVENT LOOP PHASES</text>
  <g text-anchor="middle">
    <rect x="80" y="300" width="240" height="80" rx="10" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
    <text x="200" y="336" fill="#e8eaf0" font-size="17" font-weight="700">timers</text>
    <text x="200" y="360" fill="#9aa3b5" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">setTimeout, setInterval</text>
    <rect x="380" y="300" width="200" height="80" rx="10" fill="#171a23" stroke="#34d399" stroke-width="2"/>
    <text x="480" y="336" fill="#e8eaf0" font-size="17" font-weight="700">poll</text>
    <text x="480" y="360" fill="#9aa3b5" font-size="13">I/O callbacks</text>
    <rect x="640" y="300" width="240" height="80" rx="10" fill="#171a23" stroke="#facc15" stroke-width="2"/>
    <text x="760" y="336" fill="#e8eaf0" font-size="17" font-weight="700">check</text>
    <text x="760" y="360" fill="#9aa3b5" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">setImmediate</text>
  </g>
  <line x1="320" y1="340" x2="372" y2="340" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="340" x2="632" y2="340" stroke="#9aa3b5" stroke-width="2" marker-end="url(#a)"/>
  <path d="M760 380 L760 440 L200 440 L200 388" fill="none" stroke="#9aa3b5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="480" y="466" fill="#9aa3b5" font-size="13" text-anchor="middle">next loop iteration</text>
</svg>
