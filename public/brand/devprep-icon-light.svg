<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" role="img" aria-label="DevPrep Academy App Icon Light">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dp-icl-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="dp-icl-border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Cap gradient -->
    <linearGradient id="dp-icl-cap" x1="160" y1="50" x2="350" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="60%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="dp-icl-bevel" x1="120" y1="120" x2="392" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="dp-icl-gold" x1="130" y1="310" x2="382" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#dp-icl-bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" stroke="url(#dp-icl-border)" stroke-width="3"/>

  <!-- Scaled Mark -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Mortarboard Cap -->
    <path d="M 120 120 L 256 168 L 392 120 L 392 134 L 256 182 L 120 134 Z" fill="url(#dp-icl-bevel)"/>
    <polygon points="256,52 392,120 256,168 120,120" fill="url(#dp-icl-cap)"/>
    <ellipse cx="256" cy="118" rx="8" ry="4.5" fill="#FFEAA7"/>
    <path d="M 256 118 Q 185 110 132 132" fill="none" stroke="#FFC107" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="132" cy="136" r="3.5" fill="#FFB703"/>
    <rect x="129" y="140" width="6" height="4" rx="1.5" fill="#D97706"/>
    <path d="M 129 144 L 126 195 C 126 198 138 198 138 195 L 135 144 Z" fill="#18181B"/>

    <!-- </> code brackets -->
    <g stroke="#18181B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 198 220 L 162 246 L 198 272"/>
      <path d="M 268 214 L 244 278"/>
      <path d="M 314 220 L 350 246 L 314 272"/>
    </g>

    <!-- Open book -->
    <path d="M 256 424 C 214 402 164 394 118 408 L 118 368 C 166 352 216 360 256 380 C 296 360 346 352 394 368 L 394 408 C 348 394 298 402 256 424 Z" fill="#18181B"/>
    <path d="M 256 374 C 218 344 166 336 122 350 C 120 330 120 310 124 294 C 168 280 220 292 256 324 Z" fill="url(#dp-icl-gold)"/>
    <path d="M 256 374 C 294 344 346 336 390 350 C 392 330 392 310 388 294 C 344 280 292 292 256 324 Z" fill="url(#dp-icl-gold)"/>
    <path d="M 256 324 L 256 374" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
