  <text x="520" y="268" fill="#e8eaf0" font-size="15">one contiguous slice, found fast</text>

  <rect x="500" y="340" width="420" height="96" rx="12" fill="#3a3112" stroke="#facc15" stroke-width="2"/>
  <text x="520" y="376" fill="#fde68a" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">created_at &gt;= 2026-10-20</text>
  <text x="520" y="408" fill="#e8eaf0" font-size="15">matches are scattered across every customer</text>
