<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" rx="24" fill="#0f1117"/>
  <text x="48" y="64" fill="#e8eaf0" font-size="26" font-weight="700">Three metrics, one ranked list</text>
  <text x="48" y="96" fill="#9aa3b5" font-size="17">Relevant chunks are c2 (grade 2), c4 (grade 1) and c5 (grade 2, never retrieved)</text>

  <text x="48" y="150" fill="#9aa3b5" font-size="14" font-weight="700" letter-spacing="1.2">RANK</text>
  <text x="140" y="150" fill="#9aa3b5" font-size="14" font-weight="700" letter-spacing="1.2">CHUNK</text>
  <text x="420" y="150" fill="#9aa3b5" font-size="14" font-weight="700" letter-spacing="1.2">DISCOUNT 1 / log2(rank + 1)</text>

  <g font-size="18">
    <text x="60" y="198" fill="#e8eaf0">1</text>
    <rect x="130" y="172" width="220" height="40" rx="10" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
    <text x="150" y="198" fill="#9aa3b5" font-family="ui-monospace, Menlo, Consolas, monospace">c7</text>
    <rect x="420" y="180" width="400" height="24" rx="6" fill="#60a5fa" opacity="0.85"/>
    <text x="836" y="198" fill="#9aa3b5" font-size="16">1.00</text>

    <text x="60" y="254" fill="#e8eaf0">2</text>
    <rect x="130" y="228" width="220" height="40" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
    <text x="150" y="254" fill="#e8eaf0" font-family="ui-monospace, Menlo, Consolas, monospace">c2</text>
    <text x="236" y="254" fill="#34d399" font-size="15">grade 2</text>
    <rect x="420" y="236" width="252" height="24" rx="6" fill="#60a5fa" opacity="0.85"/>
    <text x="688" y="254" fill="#9aa3b5" font-size="16">0.63</text>

    <text x="60" y="310" fill="#e8eaf0">3</text>
    <rect x="130" y="284" width="220" height="40" rx="10" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
    <text x="150" y="310" fill="#9aa3b5" font-family="ui-monospace, Menlo, Consolas, monospace">c9</text>
    <rect x="420" y="292" width="200" height="24" rx="6" fill="#60a5fa" opacity="0.85"/>
    <text x="636" y="310" fill="#9aa3b5" font-size="16">0.50</text>

    <text x="60" y="366" fill="#e8eaf0">4</text>
    <rect x="130" y="340" width="220" height="40" rx="10" fill="#10251d" stroke="#34d399" stroke-width="2"/>
    <text x="150" y="366" fill="#e8eaf0" font-family="ui-monospace, Menlo, Consolas, monospace">c4</text>
    <text x="236" y="366" fill="#34d399" font-size="15">grade 1</text>
    <rect x="420" y="348" width="172" height="24" rx="6" fill="#60a5fa" opacity="0.85"/>
    <text x="608" y="366" fill="#9aa3b5" font-size="16">0.43</text>

    <text x="60" y="422" fill="#e8eaf0">5</text>
    <rect x="130" y="396" width="220" height="40" rx="10" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
    <text x="150" y="422" fill="#9aa3b5" font-family="ui-monospace, Menlo, Consolas, monospace">c1</text>
    <rect x="420" y="404" width="155" height="24" rx="6" fill="#60a5fa" opacity="0.85"/>
    <text x="591" y="422" fill="#9aa3b5" font-size="16">0.39</text>
  </g>

  <rect x="48" y="456" width="268" height="44" rx="12" fill="#171a23" stroke="#34d399" stroke-width="2"/>
  <text x="68" y="484" fill="#e8eaf0" font-size="16">recall@5 = 2 of 3 = 0.67</text>
  <rect x="340" y="456" width="268" height="44" rx="12" fill="#171a23" stroke="#a78bfa" stroke-width="2"/>
  <text x="360" y="484" fill="#e8eaf0" font-size="16">RR = 1 / 2 = 0.50</text>
  <rect x="632" y="456" width="280" height="44" rx="12" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
  <text x="652" y="484" fill="#e8eaf0" font-size="16">nDCG@5 = 1.69 / 3.76 = 0.45</text>
</svg>
