<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#facc15"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="500" rx="24" fill="#0f1117"/>
  <text x="48" y="64" fill="#e8eaf0" font-size="26" font-weight="700">ES modules load in three phases</text>
  <text x="48" y="96" fill="#9aa3b5" font-size="17">The whole graph is found and linked before any module body runs</text>

  <!-- phases -->
  <rect x="48" y="130" width="260" height="56" rx="14" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
  <text x="72" y="165" fill="#60a5fa" font-size="16" font-weight="700">1. Construct: find files</text>
  <path d="M308 158 L 344 158" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <rect x="348" y="130" width="260" height="56" rx="14" fill="#171a23" stroke="#a78bfa" stroke-width="2"/>
  <text x="372" y="165" fill="#a78bfa" font-size="16" font-weight="700">2. Link: wire imports</text>
  <path d="M608 158 L 644 158" stroke="#facc15" stroke-width="3" marker-end="url(#y)"/>
  <rect x="648" y="130" width="264" height="56" rx="14" fill="#171a23" stroke="#34d399" stroke-width="2"/>
  <text x="672" y="165" fill="#34d399" font-size="16" font-weight="700">3. Evaluate: run bodies</text>

  <!-- graph -->
  <rect x="380" y="236" width="200" height="64" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="404" y="275" fill="#e8eaf0" font-size="18" font-family="ui-monospace, Menlo, Consolas, monospace">main.js</text>
  <circle cx="556" cy="268" r="16" fill="#34d399"/><text x="550" y="274" fill="#0f1117" font-size="16" font-weight="700">4</text>

  <rect x="180" y="330" width="200" height="64" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="204" y="369" fill="#e8eaf0" font-size="18" font-family="ui-monospace, Menlo, Consolas, monospace">a.js</text>
  <circle cx="356" cy="362" r="16" fill="#34d399"/><text x="350" y="368" fill="#0f1117" font-size="16" font-weight="700">2</text>

  <rect x="580" y="330" width="200" height="64" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="604" y="369" fill="#e8eaf0" font-size="18" font-family="ui-monospace, Menlo, Consolas, monospace">b.js</text>
  <circle cx="756" cy="362" r="16" fill="#34d399"/><text x="750" y="368" fill="#0f1117" font-size="16" font-weight="700">3</text>

  <rect x="380" y="420" width="200" height="56" rx="14" fill="#171a23" stroke="#4b5563" stroke-width="2"/>
  <text x="404" y="455" fill="#e8eaf0" font-size="18" font-family="ui-monospace, Menlo, Consolas, monospace">shared.js</text>
  <circle cx="556" cy="448" r="16" fill="#34d399"/><text x="551" y="454" fill="#0f1117" font-size="16" font-weight="700">1</text>

  <path d="M430 300 L 330 328" stroke="#6b7280" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M530 300 L 630 328" stroke="#6b7280" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M300 394 L 400 418" stroke="#6b7280" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M660 394 L 560 418" stroke="#6b7280" stroke-width="2.5" marker-end="url(#g)"/>

  <text x="48" y="260" fill="#9aa3b5" font-size="15">Green numbers:</text>
  <text x="48" y="282" fill="#9aa3b5" font-size="15">evaluation order</text>
  <text x="800" y="440" fill="#9aa3b5" font-size="15">shared.js</text>
  <text x="800" y="462" fill="#9aa3b5" font-size="15">runs once</text>
</svg>
