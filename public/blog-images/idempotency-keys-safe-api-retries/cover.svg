<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="100%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <marker id="y" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#facc15"/></marker>
  </defs>
  <rect width="1600" height="800" fill="#0b0d12"/>
  <rect width="1600" height="800" fill="url(#glow)"/>
  <rect width="1600" height="800" fill="url(#glow2)"/>

  <text x="72" y="300" fill="#60a5fa" font-size="24" font-weight="700" letter-spacing="5">BACKEND</text>
  <text x="72" y="372" fill="#f4f5f8" font-size="56" font-weight="800">Retry it.</text>
  <text x="72" y="436" fill="#f4f5f8" font-size="56" font-weight="800">Charge</text>
  <text x="72" y="500" fill="#f4f5f8" font-size="56" font-weight="800">once.</text>

  <!-- centre: three requests, one key, one charge -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24">
    <rect x="480" y="230" width="270" height="70" rx="18" fill="#171a23" stroke="#2a2f3d" stroke-width="2"/>
    <text x="508" y="274" fill="#e8eaf0">POST  key=K1</text>
    <rect x="480" y="365" width="270" height="70" rx="18" fill="#171a23" stroke="#2a2f3d" stroke-width="2"/>
    <text x="508" y="409" fill="#e8eaf0">POST  key=K1</text>
    <rect x="480" y="500" width="270" height="70" rx="18" fill="#171a23" stroke="#2a2f3d" stroke-width="2"/>
    <text x="508" y="544" fill="#e8eaf0">POST  key=K1</text>
  </g>
  <path d="M750 265 C 830 265, 830 400, 880 400" fill="none" stroke="#facc15" stroke-width="5" marker-end="url(#y)"/>
  <path d="M750 400 L 880 400" fill="none" stroke="#facc15" stroke-width="5" marker-end="url(#y)"/>
  <path d="M750 535 C 830 535, 830 400, 880 400" fill="none" stroke="#facc15" stroke-width="5" marker-end="url(#y)"/>
  <rect x="890" y="340" width="230" height="120" rx="24" fill="#10251d" stroke="#34d399" stroke-width="3"/>
  <text x="1005" y="392" fill="#6ee7b7" font-size="30" font-weight="800" text-anchor="middle">1 charge</text>
  <text x="1005" y="430" fill="#9aa3b5" font-size="20" text-anchor="middle">same response x3</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <rect x="1250" y="276" width="280" height="56" rx="28" fill="#171a23" stroke="#60a5fa" stroke-width="2"/>
    <text x="1390" y="312" fill="#e8eaf0" text-anchor="middle">Idempotency-Key</text>
    <rect x="1250" y="372" width="280" height="56" rx="28" fill="#171a23" stroke="#facc15" stroke-width="2"/>
    <text x="1390" y="408" fill="#e8eaf0" text-anchor="middle">409 / 422</text>
    <rect x="1250" y="468" width="280" height="56" rx="28" fill="#171a23" stroke="#34d399" stroke-width="2"/>
    <text x="1390" y="504" fill="#e8eaf0" text-anchor="middle">ON CONFLICT</text>
  </g>
</svg>
